[project]
name = "hermes-trading"
version = "0.1.0"
description = "Self-improving paper-trading worker steered by Hermes Agent"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "ccxt>=4.5.88",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_trading"]
